<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark light" />
        <title>snipetype - Typing Test</title>
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='20' rx='5' fill='%23ff6b4a'/%3E%3Crect x='3' y='6' width='26' height='15' rx='5' fill='%23ffbf5e'/%3E%3Ctext x='16' y='18.5' font-family='monospace' font-size='11' font-weight='700' text-anchor='middle' fill='%230b0c22'%3Est%3C/text%3E%3C/svg%3E" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="app">
            <main id="screen">
                <!-- Arcade pixel layer: drawn under the (transparent) terminal canvas. -->
                <canvas id="fx" hidden aria-hidden="true"></canvas>
                <div id="terminal"></div>
                <!-- Smooth caret over the terminal (classic simple modes). -->
                <div id="caret" hidden aria-hidden="true"></div>
            </main>
            <footer id="controls">
                <span class="brand">snipetype</span>
                <button id="custom-button" class="chrome-btn" type="button" hidden title="Edit the custom text">
                    <span class="label">edit text</span>
                </button>
                <button id="fullscreen-toggle" class="chrome-btn" type="button" aria-label="Fullscreen" data-state="off">
                    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                        <path class="enter" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
                        <path class="exit" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" />
                    </svg>
                    <span class="label">fullscreen</span>
                </button>
                <button id="sound-toggle" type="button" aria-label="Sound effects" aria-pressed="true" data-state="on">
                    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                        <path class="speaker" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
                        <path class="waves" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" />
                        <path class="mute" d="M15.5 9.5l5 5m0-5l-5 5" />
                    </svg>
                    <span class="label">sound</span>
                </button>
            </footer>
            <dialog id="custom-dialog" aria-labelledby="custom-title">
                <form method="dialog">
                    <h2 id="custom-title">custom text</h2>
                    <p>Paste or write the text to type. Line breaks are kept; tabs become spaces.</p>
                    <textarea id="custom-text" spellcheck="false" maxlength="65536"></textarea>
                    <div class="actions">
                        <button type="submit" value="cancel">cancel</button>
                        <button type="submit" value="use">use</button>
                    </div>
                </form>
            </dialog>
            <div id="loading">
                <span class="loading-text">Loading snipetype</span>
            </div>
        </div>
        <script type="module" src="app.js"></script>
    </body>
</html>
